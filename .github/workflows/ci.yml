name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Start LocalDB
        run: |
          SqlLocalDB start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'SQL Server LocalDB is required for integration checks.' }
      - name: Test a fresh installation
        run: ./scripts/test.ps1
      - name: Package Windows application
        run: ./scripts/package.ps1
      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PokemonIVCalculator-windows
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
